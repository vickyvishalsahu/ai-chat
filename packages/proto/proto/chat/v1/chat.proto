syntax = "proto3";

package chat.v1;

import "google/protobuf/timestamp.proto";

service ChatService {
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc SendMessage(SendMessageRequest) returns (stream SendMessageResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ASSISTANT = 2;
  ROLE_SYSTEM = 3;
}

message Conversation {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  Role role = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListConversationsRequest {}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

message GetConversationRequest {
  string conversation_id = 1;
}

message GetConversationResponse {
  // Absent only in the brand-new, nothing-sent-yet case.
  Conversation conversation = 1;
  // Ascending by created_at, then id. Capped server-side, not paginated.
  repeated Message messages = 2;
}

message SendMessageRequest {
  string conversation_id = 1; // client-generated UUID; upserted server-side
  string content = 2;
}

message SendMessageResponse {
  oneof payload {
    // Yielded exactly once, first: the user's message as durably
    // persisted (real id/created_at). Also the client's signal that any
    // later failure in this stream is an assistant-side failure, not a
    // send failure.
    Message user_message = 1;
    // Zero or more streamed assistant tokens.
    string content_delta = 2;
    // Yielded exactly once, last, only on success.
    Message final_message = 3;
  }
}
